    num: "4"
    nome: "Tre querce"
    grado: "5c/6b/2/6a"
    metri: "56"
    rinvii: "7"
    bellezza: ''
    chiodatore: "Benni"
    note: "Ecco l'unica via lunga(?!!) di Fosso. Il primo tiro (5c/14m/***) si sviluppa su placca appoggiata e su prese buone ma distanti. Dalla catena del 5c ci portiamo su una comoda cengia da dove parte il secondo tiro pi&#249; duro e il pi&#249; bello. La roccia &#232; scadente in partenza e quindi fate attenzione fino a quando mettete il primo rinvio. Arrampicata abbastanza continua di dita con riposo a 2/3 e uscita di braccia fino alla seconda catena. Una volta arrivati in catena vi conviene usare la corda fissa per raggiungere una comoda cengia con una bella vista! Camminando arriviamo ora ad un albero con fettuccia per autoassicurarsi. Poiche' questo tratto e quello che segue sono molto sporchi vi consigliamo di usare ancora la corda fissa che permette di raggiungere la cengia base del tiro di uscita (6a/15m/**). Da ogni cengia c'e' la possibilita' di abbandonare attraversandop a destra su sentierino delicato L'ultimo tiro di solito e' molto sporco. Una volta arrivati in catena si sale ancora per 3-4 metri fino a raggiungere il sentiero che ci porta a destra sulla base di Fosso (anelli di corda sugli alberi ogni 10 metri). Un \"viaggio esplorativo\" della parte sommitale di Fosso e un invito a scoprire le altre sue bellezze"

slug: "canyon"
name: "Gran Canyon"
background_color: "#f8e0be"
photo: "Spiro su \"Pappaglli verdi\""
note: "&#200;, dopo il Belvedere, il secondo settore di Fosso per numero di vie. Le vie si sviluppano nei due pilastri sinistro e destro, nel fondo del canyon e sulla sua parete interna destra. Le vie sui due pilastri appoggiati d'entrata (sin e dx) sono corte mentre quelle dentro il canyon possono superare i 20 metri di sviluppo. Il settore &#232; abbastanza fresco d'estate."

    grado: "6a"
    metri: "18"
    rinvii: "9"
    bellezza: "**"
    chiodatore: "Benni"
    note: "-"
    storia: "A Benni era sempre piaciuta l'idea di chiodare o di far passare una via sfruttando gran parte del camino. &#200; stato per&#242; anticipato da piccole frane e da un maialino rimasto incastrato e poi morto proprio dentro il camino! Per circa due anni c'e' stato odore di cadavere fino a che una buona dose di calce viva ha sistemato tutto. A Benni per&#242; era rimasta ancora la voglia di chiodarlo... beh, se non proprio li, subito di fianco allora!!!"

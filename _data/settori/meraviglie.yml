slug: "meraviglie"
name: "Placca delle meraviglie"
background_color: "#bcaa9e"
note: "Settore storico ricco di memorie e forti emozioni legate in gran parte alla Capanna. L'ex proprietario del terreno ovviamente non la vedeva di buon occhio. Purtroppo qualche anno dopo la costruzione venne mandata in fumo, di notte, non si &#232; mai saputo da chi. A detta di chi l'ha frequentata la capanna era una sorta di rifugio, bella arroccata nel suo angolo, alta sotto il tettone delle placche. Le serate d'estate, dopo il lavoro, era per qualcuno il punto fisso del ritrovo infrasettimanale. Scrivendo questo, il nostro pensiero ed affetto va al mitico Gian Paolo Baraldi che si era fatto in quattro per costruirla. Le vie di questo settore sono le pi&#249; lunghe di Fosso e vanno da un minimo di 23 ad un massimo di 27 metri e sono per lo pi&#249; sullo stesso grado (6a+) tranne la prima a sinistra e le ultime due a destra. Il terreno di gioco &#232; costituito da roccia di buona qualit&#224; leggermente appoggiata. Arrampicata tecnica quindi e mai di forza eccezion fatta per la \"Rue du cinno\" che richiede forza di braccia e buone dita. Tutte le vie sono di Benni."
routes:
  -
    num: "1"
    nome: "Pensaci Giacomino"
    grado: "6b"
    metri: "23"
    rinvii: "11"
    bellezza: "***"
    chiodatore: "Benni"
    note: "Interessante via di movimento e dita"
    storia: "Partenza modificata dopo la frana di Pasqua 2003"
  -
    num: "2"
    nome: "Profumo di muschio"
    grado: "6a+"
    metri: "23"
    rinvii: "10"
    bellezza: "***"
    chiodatore: "Benni"
    note: "Tecnica, movimento e ottimo uso dei piedi come per altro richiesto su tutte le vie del settore"
  -
    num: "3"
    nome: "La radice sotto il tetto"
    grado: "6a+"
    metri: "24"
    rinvii: "11"
    bellezza: "***"
    chiodatore: "Benni"
    note: "La pi&#249; fisica (per il grado) del settore. La radice fa presa e introduce al crux di braccia"
  -
    num: "4"
    nome: "Il ponte dei sospiri"
    grado: "6b"
    metri: "24"
    rinvii: "11"
    bellezza: "****"
    chiodatore: "Benni"
    note: "Bellissima via con partenza atletica e molto movimento prima a destra e poi a sinistra"
    storia: "Occhio al nido di uccelli a 10 metri circa. Astenersi quando ci sono le uova e i piccoli (mesi da aprile a luglio)"
  -
    num: "5"
    nome: "Meditazione Zen"
    grado: "6b"
    metri: "26"
    rinvii: "12"
    bellezza: "*****"
    chiodatore: "Benni"
    note: "Il capolavoro di Benni ed una delle vie pi&#249; belle di tutta Fosso. Divertentissimo viaggio di tecnica ed equilibrio"
  -
    num: "6"
    nome: "L'ombra del vento"
    grado: "6a+"
    metri: "26"
    rinvii: "11"
    bellezza: "***"
    chiodatore: "Benni"
    note: "Bella ma un poco costretta e quasi imposta in modo forzato in un posto che era gi&#224; saturo di vie. Un poco di confusione su dove passare."
    storia: "Aperta poco dopo la frana del 2003"
  -
    num: "7"
    nome: "La sostenibile pesantezza del non essere"
    grado: "6a+"
    metri: "27"
    rinvii: "12"
    bellezza: "***"
    chiodatore: "Benni"
    note: "Bellissima anche questa via. Di solito sporca ma molto completa e varia. Partenza un poco \"cazzuta\" e poi un mix di tecnica e movimento dove i piedi prendono il sopravvento"
  -
    num: "8"
    nome: "Rue du Cinno (via del Cinno)"
    grado: "6c"
    metri: "25"
    rinvii: "?"
    bellezza: "****"
    chiodatore: "Benni"
    note: "Bella via che parte un poco a sinistra delle scale dell'ex-capanna. Due passi di braccia per superare il tetto. Dita ed un buon uso di piedi per la parte bassa. Spettacolare e molto fotogenica per via del tetto. Di solito sporca, soprattutto le due prese buone per uscire dal tetto. Cordino appena sostituito sul tetto (luglio 2007). Andate sereni!!"
    storia: "Dedicata a Luca, figlio di Benni, per via del suo soprannome"
  -
    num: "9"
    nome: "Fumo di Londra"
    grado: "6c"
    metri: "26"
    rinvii: "12"
    bellezza: "****"
    chiodatore: "Benni"
    note: "Ecco un altro gioiello del genio di Benni. Entusiasmante via di tecnica e movimento che supera con astuzia e intelligenza il tetto traversando a destra. Qualche passaggio richiede forza nelle dita"
    storia: "In origine si chiamava \"La gatta sul tetto che sghetta\", ma ha cambiato nome quando &#232; stata bruciata la capanna"
